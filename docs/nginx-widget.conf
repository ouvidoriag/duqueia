# ════════════════════════════════════════════════════════════════════════════════
# nginx-widget.conf — Configuração Nginx para o Chat Widget Embutível da Duque IA
# Inclua este trecho dentro do bloco server {} do seu nginx.conf ou em /etc/nginx/conf.d/
#
# Produção: http://ogm.duquedecaxias.rj.gov.br/duqueia/
# ════════════════════════════════════════════════════════════════════════════════

upstream duque_ia_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen 443 ssl http2;
    server_name ogm.duquedecaxias.rj.gov.br;

    # ssl_certificate     /etc/letsencrypt/live/ogm.duquedecaxias.rj.gov.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ogm.duquedecaxias.rj.gov.br/privkey.pem;

    # ── Proxy base para toda a aplicação Duque IA ──────────────────────────────
    location /duqueia/ {
        proxy_pass         http://duque_ia_backend/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # ── widget.js: cache curto (5 min) para propagação rápida de atualizações ──
    # Sites externos que carregam o widget verão a versão atualizada em até 5 min.
    location = /duqueia/widget.js {
        proxy_pass         http://duque_ia_backend/widget.js;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_hide_header  Cache-Control;
        add_header         Cache-Control "public, max-age=300, must-revalidate" always;
        # Permite carregamento de qualquer domínio da Prefeitura
        add_header         Access-Control-Allow-Origin "*" always;
    }

    # ── /embed/chat: rota do iframe — remove X-Frame-Options herdado ──────────
    # O Node.js já envia Content-Security-Policy: frame-ancestors com as origens
    # configuradas em EMBED_ALLOWED_ORIGINS. O Nginx apenas remove o header global
    # X-Frame-Options (se houver) para não conflitar com a CSP do iframe.
    location /duqueia/embed {
        proxy_pass         http://duque_ia_backend/embed;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Remove X-Frame-Options global para que a CSP frame-ancestors do Node.js
        # seja a única política de controle de embedding.
        proxy_hide_header  X-Frame-Options;
        add_header         X-Frame-Options "" always;
    }

    # ── API: sem cache, sem frame restrictions ──────────────────────────────────
    location /duqueia/api/ {
        proxy_pass         http://duque_ia_backend/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        add_header         Cache-Control "no-store" always;
    }
}

